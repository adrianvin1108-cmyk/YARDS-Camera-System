<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yards Brewing - AI Can Defect Detection Digital Twin</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700;800&display=swap');
    
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0f17;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    input[type=range] {
      -webkit-appearance: none;
      background: #1e293b;
      border-radius: 4px;
      height: 6px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
      border: 2px solid #0f172a;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.5);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(71, 85, 105, 0.4);
    }
    .yards-bg-accent {
      background-color: #dc2626;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const CAN_SIZES = {
      '12oz': { name: '12 oz Standard', height: 122.7, od: 66.0, id: 54.0, radius: 0.33, hFactor: 1.0 },
      '16oz': { name: '16 oz Tallboy', height: 157.2, od: 66.0, id: 54.0, radius: 0.33, hFactor: 1.28 },
      '19.2oz': { name: '19.2 oz Stovepipe', height: 182.6, od: 66.0, id: 54.0, radius: 0.33, hFactor: 1.48 },
      'sleek': { name: '12 oz Sleek', height: 148.0, od: 58.0, id: 48.0, radius: 0.29, hFactor: 1.2 },
      'stubby': { name: '8 oz Stubby', height: 92.0, od: 66.0, id: 54.0, radius: 0.33, hFactor: 0.75 }
    };

    const DEFECT_TYPES = {
      'NONE': { name: 'Good Can', severity: 'PASS', desc: 'Flange & Rim within specifications', color: '#22c55e' },
      'BENT_RIM': { name: 'Bent Flange Rim', severity: 'FAIL', desc: 'Deformed top lip curvature', color: '#ef4444' },
      'OD_OFFSET': { name: 'Incorrect OD', severity: 'FAIL', desc: 'Outer diameter exceeds ±0.5mm', color: '#f59e0b' },
      'DENT': { name: 'Sidewall Dent', severity: 'FAIL', desc: 'Physical body impact deformation', color: '#ec4899' },
      'CRUSHED': { name: 'Crushed Flange', severity: 'FAIL', desc: 'Vertical compression on top chime', color: '#dc2626' },
      'CONTAMINATION': { name: 'Foreign Stain', severity: 'FAIL', desc: 'Dark surface residue on lid', color: '#a855f7' }
    };

    function App() {
      const [isRunning, setIsRunning] = useState(true);
      const [beltSpeed, setBeltSpeed] = useState(1.2); 
      const [cameraWD, setCameraWD] = useState(450);
      const [cameraHeight, setCameraHeight] = useState(420);
      const [canSize, setCanSize] = useState('12oz');
      const [canAppearance, setCanAppearance] = useState('silver');
      const [autoDefectRate, setAutoDefectRate] = useState(10);
      const [queuedCount, setQueuedCount] = useState(0);
      const defectQueueRef = useRef([]);
      const [lastQueuedDefect, setLastQueuedDefect] = useState(null);
      const [viewPreset, setViewPreset] = useState('isometric');
      
      const [currentScan, setCurrentScan] = useState({
        canId: 'CAN-000',
        status: 'PASS',
        measuredOD: 66.00,
        measuredID: 54.00,
        circularity: 99.8,
        confidence: 99.5,
        defectType: 'NONE',
        timestamp: new Date().toLocaleTimeString()
      });

      const [stats, setStats] = useState({
        totalInspected: 0,
        totalPassed: 0,
        totalFailed: 0,
        airEjections: 0,
        lastEjectTime: '--'
      });

      const [logs, setLogs] = useState([]);
      const [logFilter, setLogFilter] = useState('ALL');

      const mountRef = useRef(null);
      const sceneRef = useRef(null);
      const cansRef = useRef([]);
      const pusherMeshRef = useRef(null);
      const cameraRigRef = useRef(null);
      const canIdCounter = useRef(1001);
      const speedRef = useRef(beltSpeed);
      const runningRef = useRef(isRunning);
      const viewRef = useRef(viewPreset);
      const canSizeRef = useRef(canSize);
      const autoRateRef = useRef(autoDefectRate);
      const appearanceRef = useRef(canAppearance);
      const spawnRef = useRef(null);
      const inspectRef = useRef(null);
      const rejectRef = useRef(null);

      speedRef.current = beltSpeed;
      runningRef.current = isRunning;
      viewRef.current = viewPreset;
      canSizeRef.current = canSize;
      autoRateRef.current = autoDefectRate;
      appearanceRef.current = canAppearance;

      // Update cans already traveling on the conveyor as well as future cans.
      useEffect(() => {
        cansRef.current.forEach(can => {
          if (can.labelMesh) can.labelMesh.visible = canAppearance === 'yards';
        });
      }, [canAppearance]);

      // The graphic is generated on a canvas: no image files or external textures needed.
      const labelTextureRef = useRef(null);
      if (!labelTextureRef.current) {
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#f5e8cf';
        ctx.fillRect(0, 0, 1024, 512);
        ctx.fillStyle = '#9c2026';
        ctx.fillRect(0, 0, 1024, 78);
        ctx.fillRect(0, 438, 1024, 74);
        ctx.fillStyle = '#152b3b';
        ctx.fillRect(0, 78, 1024, 8);
        ctx.fillRect(0, 428, 1024, 10);
        for (let x = 0; x < 1024; x += 512) {
          ctx.textAlign = 'center';
          ctx.fillStyle = '#172d3e';
          ctx.font = 'bold 114px Arial, sans-serif';
          ctx.fillText('YARDS', x + 256, 265);
          ctx.font = 'bold 29px Arial, sans-serif';
          ctx.fillText('BREWING COMPANY', x + 256, 311);
          ctx.fillStyle = '#9c2026';
          ctx.font = 'bold 22px Arial, sans-serif';
          ctx.fillText('PHILADELPHIA', x + 256, 365);
        }
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace || undefined;
        texture.anisotropy = 4;
        labelTextureRef.current = texture;
      }

      const queueDefect = (type) => {
        defectQueueRef.current.push(type);
        setQueuedCount(defectQueueRef.current.length);
        setLastQueuedDefect(type);
      };

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const width = container.clientWidth;
        const height = container.clientHeight;

        const scene = new THREE.Scene();
        sceneRef.current = scene;
        scene.background = new THREE.Color('#070a11');
        scene.fog = new THREE.FogExp2('#070a11', 0.08);

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
        camera.position.set(2.8, 2.5, 3.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const gridHelper = new THREE.GridHelper(20, 40, 0x334155, 0x1e293b);
        gridHelper.position.y = -0.01;
        scene.add(gridHelper);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 8, 4);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // Conveyor Line
        const conveyorGroup = new THREE.Group();
        scene.add(conveyorGroup);

        const bedGeo = new THREE.BoxGeometry(10, 0.2, 0.8);
        const bedMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4, metalness: 0.8 });
        const bed = new THREE.Mesh(bedGeo, bedMat);
        bed.position.set(0, 0.8, 0);
        bed.receiveShadow = true;
        conveyorGroup.add(bed);

        const beltGeo = new THREE.BoxGeometry(10, 0.02, 0.6);
        const beltMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.9 });
        const belt = new THREE.Mesh(beltGeo, beltMat);
        belt.position.set(0, 0.91, 0);
        conveyorGroup.add(belt);

        const railGeo = new THREE.BoxGeometry(10, 0.08, 0.04);
        const railMat = new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.9, roughness: 0.2 });
        const railL = new THREE.Mesh(railGeo, railMat);
        railL.position.set(0, 0.98, -0.32);
        const railR = new THREE.Mesh(railGeo, railMat);
        railR.position.set(0, 0.98, 0.32);
        conveyorGroup.add(railL, railR);

        for (let x = -4; x <= 4; x += 2) {
          const legGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.8);
          const legMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.7 });
          const leg1 = new THREE.Mesh(legGeo, legMat);
          leg1.position.set(x, 0.4, -0.35);
          const leg2 = new THREE.Mesh(legGeo, legMat);
          leg2.position.set(x, 0.4, 0.35);
          conveyorGroup.add(leg1, leg2);
        }

        // Camera Gantry
        const gantryGroup = new THREE.Group();
        gantryGroup.position.set(0, 0, 0);
        scene.add(gantryGroup);
        cameraRigRef.current = gantryGroup;

        const pillarGeo = new THREE.BoxGeometry(0.06, 2.2, 0.06);
        const frameMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.6, roughness: 0.3 });
        const p1 = new THREE.Mesh(pillarGeo, frameMat);
        p1.position.set(-0.15, 1.8, -0.45);
        const p2 = new THREE.Mesh(pillarGeo, frameMat);
        p2.position.set(-0.15, 1.8, 0.45);
        gantryGroup.add(p1, p2);

        const bridgeGeo = new THREE.BoxGeometry(0.1, 0.08, 0.96);
        const bridge = new THREE.Mesh(bridgeGeo, frameMat);
        bridge.position.set(-0.15, 2.8, 0);
        gantryGroup.add(bridge);

        const camBodyGroup = new THREE.Group();
        camBodyGroup.position.set(0, 1.8, 0);
        gantryGroup.add(camBodyGroup);

        const keyenceBodyGeo = new THREE.BoxGeometry(0.2, 0.28, 0.2);
        const keyenceMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.5, roughness: 0.2 });
        const keyenceMesh = new THREE.Mesh(keyenceBodyGeo, keyenceMat);
        camBodyGroup.add(keyenceMesh);

        const lensGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.1, 32);
        const lensMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.9, roughness: 0.1 });
        const lens = new THREE.Mesh(lensGeo, lensMat);
        lens.position.set(0, -0.15, 0);
        camBodyGroup.add(lens);

        const ringGeo = new THREE.TorusGeometry(0.12, 0.025, 16, 32);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0xe0f2fe, emissive: 0x38bdf8, emissiveIntensity: 0.8 });
        const ringLight = new THREE.Mesh(ringGeo, ringMat);
        ringLight.rotation.x = Math.PI / 2;
        ringLight.position.set(0, -0.18, 0);
        camBodyGroup.add(ringLight);

        const coneGeo = new THREE.ConeGeometry(0.28, 0.8, 32, 1, true);
        const coneMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.18, wireframe: true });
        const laserCone = new THREE.Mesh(coneGeo, coneMat);
        laserCone.position.set(0, -0.55, 0);
        camBodyGroup.add(laserCone);

        // Rejecter Station
        const rejectGroup = new THREE.Group();
        rejectGroup.position.set(2.2, 0.92, 0);
        scene.add(rejectGroup);

        const cylGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.3, 16);
        cylGeo.rotateX(Math.PI / 2);
        const cylMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.8 });
        const cyl = new THREE.Mesh(cylGeo, cylMat);
        cyl.position.set(0, 0.1, -0.4);
        rejectGroup.add(cyl);

        const padGeo = new THREE.BoxGeometry(0.22, 0.15, 0.03);
        const padMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3 });
        const pusher = new THREE.Mesh(padGeo, padMat);
        pusher.position.set(0, 0.1, -0.22);
        rejectGroup.add(pusher);
        pusherMeshRef.current = pusher;

        const binGeo = new THREE.BoxGeometry(0.7, 0.5, 0.6);
        const binMat = new THREE.MeshStandardMaterial({ color: 0x1e3a8a, transparent: true, opacity: 0.7 });
        const bin = new THREE.Mesh(binGeo, binMat);
        bin.position.set(0, -0.2, 0.65);
        rejectGroup.add(bin);

        const sensorGeo = new THREE.BoxGeometry(0.05, 0.08, 0.05);
        const sensorMat = new THREE.MeshStandardMaterial({ color: 0xeab308 });
        const peSensor = new THREE.Mesh(sensorGeo, sensorMat);
        peSensor.position.set(-0.6, 1.05, -0.32);
        scene.add(peSensor);

        let lastTime = performance.now();
        const FIXED_CAN_DISTANCE = 1.65; // Approx. 1.5 can-width visible spacing between cans
        let spawnAccumulator = FIXED_CAN_DISTANCE; // First can enters immediately
        let frameId;
        let disposed = false;

        const animate = (time) => {
          if (disposed) return;
          frameId = requestAnimationFrame(animate);
          const dt = Math.min((time - lastTime) / 1000, 0.05);
          lastTime = time;

          if (viewRef.current === 'top') {
            camera.position.set(0, 4.5, 0.001);
            camera.lookAt(0, 0, 0);
          } else if (viewRef.current === 'side') {
            camera.position.set(0, 1.2, 3.5);
            camera.lookAt(0, 1.0, 0);
          } else if (viewRef.current === 'reject') {
            camera.position.set(2.2, 1.8, 1.8);
            camera.lookAt(2.2, 0.9, 0);
          } else {
            camera.position.set(2.8, 2.5, 3.2);
            camera.lookAt(0, 0.9, 0);
          }

          if (runningRef.current) {
            const distanceMoved = speedRef.current * dt;
            // Every can and the spawn accumulator advance by the SAME distance.
            // Altering speed never alters spacing or restarts the scene.
            spawnAccumulator += distanceMoved;
            while (spawnAccumulator >= FIXED_CAN_DISTANCE) {
              spawnAccumulator -= FIXED_CAN_DISTANCE;
              spawnRef.current?.();
            }

            for (let idx = cansRef.current.length - 1; idx >= 0; idx--) {
              const canObj = cansRef.current[idx];
              if (!canObj.ejected) {
                canObj.mesh.position.x += distanceMoved;

                if (!canObj.inspected && canObj.mesh.position.x >= 0) {
                  canObj.inspected = true;
                  inspectRef.current?.(canObj);
                }

                if (canObj.isDefect && !canObj.ejectionTriggered && canObj.mesh.position.x >= 2.15) {
                  canObj.ejectionTriggered = true;
                  rejectRef.current?.(canObj);
                }

                if (canObj.mesh.position.x > 5.0) {
                  scene.remove(canObj.mesh);
                  cansRef.current.splice(idx, 1);
                }
              } else {
                canObj.mesh.position.z += 2.5 * dt;
                canObj.mesh.position.y -= 1.8 * dt;
                canObj.mesh.rotation.x += 5 * dt;
                canObj.mesh.rotation.z += 3 * dt;

                if (canObj.mesh.position.y <= 0.4) {
                  scene.remove(canObj.mesh);
                  cansRef.current.splice(idx, 1);
                }
              }
            }
          }

          renderer.render(scene, camera);
        };

        animate(performance.now());

        const handleResize = () => {
          if (!container) return;
          camera.aspect = container.clientWidth / container.clientHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(container.clientWidth, container.clientHeight);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          disposed = true;
          cancelAnimationFrame(frameId);
          window.removeEventListener('resize', handleResize);
          if (container.contains(renderer.domElement)) {
            container.removeChild(renderer.domElement);
          }
          scene.traverse(obj => {
            if (obj.geometry) obj.geometry.dispose();
            if (obj.material) {
              const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
              mats.forEach(mat => mat.dispose());
            }
          });
          renderer.dispose();
          cansRef.current = [];
        };
      }, []);

      const spawnCan = () => {
        if (!sceneRef.current) return;
        const spec = CAN_SIZES[canSizeRef.current];
        const canGroup = new THREE.Group();

        const h = 0.7 * spec.hFactor;
        const r = spec.radius;
        // Lathed aluminum silhouette with rolled base, tapered shoulders and neck.
        const profile = [
          [r * .75, -h / 2], [r * .85, -h / 2 + .018],
          [r * .98, -h / 2 + .052], [r, -h / 2 + .09],
          [r, h / 2 - .14], [r * .98, h / 2 - .105],
          [r * .86, h / 2 - .050], [r * .84, h / 2 - .018],
          [r * .86, h / 2]
        ].map(([radius, y]) => new THREE.Vector2(radius, y));
        const bodyGeo = new THREE.LatheGeometry(profile, 64);
        const canMat = new THREE.MeshStandardMaterial({
          color: 0xdce5ea, metalness: 0.82, roughness: 0.26,
          envMapIntensity: 0.8, side: THREE.DoubleSide
        });
        const body = new THREE.Mesh(bodyGeo, canMat);
        body.castShadow = true;
        body.receiveShadow = true;
        canGroup.add(body);

        // Cylindrical printed wrap, deliberately below the shaped shoulder.
        const labelHeight = h * 0.53;
        const labelGeo = new THREE.CylinderGeometry(r * 1.006, r * 1.006, labelHeight, 64, 1, true);
        const labelMat = new THREE.MeshStandardMaterial({
          map: labelTextureRef.current, metalness: 0.26, roughness: 0.42,
          side: THREE.DoubleSide
        });
        const labelMesh = new THREE.Mesh(labelGeo, labelMat);
        labelMesh.position.y = -h * 0.015;
        labelMesh.visible = appearanceRef.current === 'yards';
        canGroup.add(labelMesh);

        // Recessed end and silver rolled upper lip.
        const lidMat = new THREE.MeshStandardMaterial({ color: 0xcbd5dd, metalness: 0.88, roughness: 0.32, side: THREE.DoubleSide });
        const lid = new THREE.Mesh(new THREE.CircleGeometry(r * .80, 64), lidMat);
        lid.rotation.x = -Math.PI / 2;
        lid.position.y = h / 2 - .015;
        canGroup.add(lid);
        const rimGeo = new THREE.TorusGeometry(r * .86, .014, 12, 64);
        rimGeo.rotateX(Math.PI / 2);
        const rimMesh = new THREE.Mesh(rimGeo, lidMat);
        rimMesh.position.y = h / 2 + .002;
        canGroup.add(rimMesh);
        const innerRing = new THREE.Mesh(new THREE.TorusGeometry(r * .62, .005, 8, 48), lidMat);
        innerRing.rotation.x = Math.PI / 2;
        innerRing.position.y = h / 2 - .012;
        canGroup.add(innerRing);
        // Scored opening and pull tab detail; both follow lid when rim is deformed.
        const score = new THREE.Mesh(new THREE.TorusGeometry(r * .40, .0035, 8, 48),
          new THREE.MeshStandardMaterial({ color: 0x82919f, metalness: .65, roughness: .4 }));
        score.rotation.x = Math.PI / 2;
        score.scale.set(1, .72, 1);
        score.position.set(0, h / 2 - .008, -.025);
        canGroup.add(score);
        const tab = new THREE.Mesh(new THREE.BoxGeometry(r * .26, .006, r * .63), lidMat);
        tab.position.set(0, h / 2 - .003, .025);
        canGroup.add(tab);
        const rivet = new THREE.Mesh(new THREE.SphereGeometry(.012, 10, 8), lidMat);
        rivet.scale.y = .25;
        rivet.position.set(0, h / 2 + .002, -.045);
        canGroup.add(rivet);
        // Concave-looking underside lip, visible from side/rejection view.
        const baseRing = new THREE.Mesh(new THREE.TorusGeometry(r * .76, .014, 10, 48), lidMat);
        baseRing.rotation.x = Math.PI / 2;
        baseRing.position.y = -h / 2 + .004;
        canGroup.add(baseRing);

        // Manually queued defective cans take priority over random defects.
        // Queued cans enter at the next naturally spaced position.
        let currentDefect = 'NONE';
        if (defectQueueRef.current.length > 0) {
          currentDefect = defectQueueRef.current.shift();
          setQueuedCount(defectQueueRef.current.length);
        } else if (Math.random() * 100 < autoRateRef.current) {
          const choices = Object.keys(DEFECT_TYPES).filter(key => key !== 'NONE');
          currentDefect = choices[Math.floor(Math.random() * choices.length)];
        }

        if (currentDefect === 'OD_OFFSET') {
          body.scale.set(1.06, 1, 1.06);
          labelMesh.scale.set(1.06, 1, 1.06);
          rimMesh.scale.set(1.06, 1.06, 1.06);
        } else if (currentDefect === 'BENT_RIM') {
          rimMesh.rotation.z = 0.35;
          rimMesh.position.x += 0.03;
        } else if (currentDefect === 'DENT') {
          body.scale.set(0.85, 1, 1.15);
          labelMesh.scale.set(0.85, 1, 1.15);
        } else if (currentDefect === 'CRUSHED') {
          body.scale.set(1.05, 0.8, 1.05);
          labelMesh.scale.set(1.05, 0.8, 1.05);
          rimMesh.position.y *= 0.82;
        } else if (currentDefect === 'CONTAMINATION') {
          const stainGeo = new THREE.CircleGeometry(0.12, 16);
          stainGeo.rotateX(-Math.PI / 2);
          const stainMat = new THREE.MeshBasicMaterial({ color: 0x3b0764 });
          const stain = new THREE.Mesh(stainGeo, stainMat);
          stain.position.set(0.05, h / 2 + .009, 0.02);
          canGroup.add(stain);
        }

        const idStr = `CAN-${canIdCounter.current++}`;
        canGroup.position.set(-4.8, 0.92 + h / 2, 0);
        sceneRef.current.add(canGroup);

        cansRef.current.push({
          id: idStr,
          mesh: canGroup,
          labelMesh,
          inspected: false,
          isDefect: currentDefect !== 'NONE',
          defectType: currentDefect,
          ejected: false,
          ejectionTriggered: false
        });
      };

      const evaluateInspection = (canObj) => {
        const spec = CAN_SIZES[canSizeRef.current];
        const isFail = canObj.isDefect;
        
        let measuredOD = spec.od;
        let measuredID = spec.id;
        let circularity = 99.6;
        let confidence = 99.4;

        if (isFail) {
          if (canObj.defectType === 'BENT_RIM') {
            circularity = 86.4;
            confidence = 94.1;
          } else if (canObj.defectType === 'OD_OFFSET') {
            measuredOD = spec.od + 1.15;
            confidence = 97.6;
          } else if (canObj.defectType === 'DENT') {
            circularity = 91.2;
            confidence = 92.5;
          } else if (canObj.defectType === 'CRUSHED') {
            measuredID = spec.id - 2.4;
            circularity = 81.0;
          } else if (canObj.defectType === 'CONTAMINATION') {
            confidence = 88.0;
          }
        }

        const statusStr = isFail ? 'FAIL' : 'PASS';
        const scanResult = {
          canId: canObj.id,
          status: statusStr,
          measuredOD: parseFloat(measuredOD.toFixed(2)),
          measuredID: parseFloat(measuredID.toFixed(2)),
          circularity: parseFloat(circularity.toFixed(1)),
          confidence: parseFloat(confidence.toFixed(1)),
          defectType: canObj.defectType,
          timestamp: new Date().toLocaleTimeString()
        };

        setCurrentScan(scanResult);

        setStats(prev => ({
          ...prev,
          totalInspected: prev.totalInspected + 1,
          totalPassed: isFail ? prev.totalPassed : prev.totalPassed + 1,
          totalFailed: isFail ? prev.totalFailed + 1 : prev.totalFailed
        }));

        setLogs(prev => [scanResult, ...prev.slice(0, 49)]);
      };

      const triggerAirReject = (canObj) => {
        canObj.ejected = true;
        
        if (pusherMeshRef.current) {
          pusherMeshRef.current.position.z = -0.05;
          setTimeout(() => {
            if (pusherMeshRef.current) pusherMeshRef.current.position.z = -0.22;
          }, 150);
        }

        setStats(prev => ({
          ...prev,
          airEjections: prev.airEjections + 1,
          lastEjectTime: new Date().toLocaleTimeString()
        }));
      };

      spawnRef.current = spawnCan;
      inspectRef.current = evaluateInspection;
      rejectRef.current = triggerAirReject;

      useEffect(() => {
        if (cameraRigRef.current) {
          const heightY = 1.0 + (cameraHeight / 400);
          if (cameraRigRef.current.children[3]) {
            cameraRigRef.current.children[3].position.y = heightY;
          } 
        }
      }, [cameraHeight, cameraWD]);

      const filteredLogs = useMemo(() => {
        if (logFilter === 'PASS') return logs.filter(l => l.status === 'PASS');
        if (logFilter === 'FAIL') return logs.filter(l => l.status === 'FAIL');
        return logs;
      }, [logs, logFilter]);

      const exportCSV = () => {
        const headers = "Can ID,Timestamp,Status,Defect Type,Measured OD (mm),Measured ID (mm),Circularity (%),Confidence (%)\n";
        const rows = logs.map(l => `${l.canId},${l.timestamp},${l.status},${l.defectType},${l.measuredOD},${l.measuredID},${l.circularity},${l.confidence}`).join("\n");
        const blob = new Blob([headers + rows], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Yards_Inspection_Log_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
      };

      return (
        <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100">
          
          {/* STICKY HEADER */}
          <header className="sticky top-0 h-16 border-b border-slate-800 bg-slate-900/95 backdrop-blur px-6 flex items-center justify-between z-50">
            <div className="flex items-center space-x-4">
              <div className="h-9 w-9 rounded-lg yards-bg-accent flex items-center justify-center font-bold text-white shadow-lg shadow-red-600/30">
                Y
              </div>
              <div>
                <div className="flex items-center space-x-2">
                  <h1 className="font-bold text-lg tracking-tight">YARDS BREWING COMPANY</h1>
                  <span className="text-xs bg-red-950/80 text-red-400 border border-red-800/60 px-2 py-0.5 rounded font-mono">IST 440W CAPSTONE</span>
                </div>
                <p className="text-xs text-slate-400">AI Can Defect Detection & Removal System • Keyence VS-C320 Digital Twin</p>
              </div>
            </div>

            <nav className="hidden md:flex items-center space-x-2">
              <a href="#simulation" className="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200">3D Simulation</a>
              <a href="#vision" className="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200">Vision HUD</a>
              <a href="#workflow" className="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200">Workflow</a>
              <a href="#architecture" className="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200">Architecture</a>
              <a href="#logs" className="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200">Logs</a>
            </nav>

            <div className="flex items-center space-x-3">
              <button 
                onClick={() => setIsRunning(!isRunning)} 
                className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-2 ${isRunning ? 'bg-amber-500/20 text-amber-400 border border-amber-500/40 hover:bg-amber-500/30' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 hover:bg-emerald-500/30'}`}
              >
                <span>{isRunning ? 'Pause Line' : 'Resume Line'}</span>
              </button>
            </div>
          </header>

          {/* MAIN SCROLLABLE CONTENT CONTAINER */}
          <main className="flex-1 flex flex-col space-y-12 p-6 max-w-7xl mx-auto w-full">
            
            {/* SECTION 1: 3D DIGITAL TWIN SIMULATION */}
            <section id="simulation" className="space-y-4">
              <div className="flex justify-between items-center">
                <div>
                  <h2 className="text-xl font-bold text-white tracking-wide">Interactive 3D Production Line Simulation</h2>
                  <p className="text-xs text-slate-400">Live conveyor simulation with adjustable belt velocity, elevated camera optics, and pneumatic rejection.</p>
                </div>
                <div className="flex items-center space-x-2">
                  <span className="text-xs font-mono text-emerald-400 font-bold bg-emerald-950/50 border border-emerald-800 px-3 py-1 rounded">BELT SPEED: {beltSpeed.toFixed(1)} units/sec</span>
                </div>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                
                {/* 3D Canvas Viewport */}
                <div className="lg:col-span-3 h-[520px] rounded-2xl glass-panel relative overflow-hidden shadow-2xl flex flex-col">
                  <div ref={mountRef} className="w-full h-full cursor-grab active:cursor-grabbing" />
                  
                  {/* View Presets Floating Toolbar */}
                  <div className="absolute bottom-4 left-1/2 -translate-x-1/2 glass-panel px-4 py-2 rounded-xl flex items-center space-x-2 z-10">
                    <span className="text-xs font-bold text-slate-400 mr-2">3D Views:</span>
                    <button onClick={() => setViewPreset('isometric')} className={`px-3 py-1 rounded text-xs font-medium ${viewPreset === 'isometric' ? 'bg-sky-500 text-white' : 'bg-slate-800 text-slate-300'}`}>Isometric</button>
                    <button onClick={() => setViewPreset('top')} className={`px-3 py-1 rounded text-xs font-medium ${viewPreset === 'top' ? 'bg-sky-500 text-white' : 'bg-slate-800 text-slate-300'}`}>Top View</button>
                    <button onClick={() => setViewPreset('side')} className={`px-3 py-1 rounded text-xs font-medium ${viewPreset === 'side' ? 'bg-sky-500 text-white' : 'bg-slate-800 text-slate-300'}`}>Side Elevation</button>
                    <button onClick={() => setViewPreset('reject')} className={`px-3 py-1 rounded text-xs font-medium ${viewPreset === 'reject' ? 'bg-sky-500 text-white' : 'bg-slate-800 text-slate-300'}`}>Reject Station</button>
                  </div>
                </div>

                {/* Simulation Control Sidebar */}
                <div className="space-y-4">
                  
                  <div className="glass-panel p-4 rounded-xl space-y-3">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 border-b border-slate-800 pb-2">Conveyor Belt Speed</h3>
                    <div className="space-y-2">
                      <div className="flex justify-between text-xs">
                        <span className="text-slate-400">Velocity:</span>
                        <span className="font-mono text-sky-400 font-bold">{beltSpeed.toFixed(1)} units/sec</span>
                      </div>
                      <input 
                        type="range" 
                        min="0.2" 
                        max="3.5" 
                        step="0.1"

                        onChange={(e) => setBeltSpeed(parseFloat(e.target.value))} 
                        className="w-full accent-sky-400 cursor-pointer"
                      />
                      <div className="flex justify-between text-[10px] text-slate-500 font-mono">
                        <span>Slow (0.2)</span>
                        <span>Normal (1.2)</span>
                        <span>Fast (3.5)</span>
                      </div>
                    </div>
                  </div>

                  <div className="glass-panel p-4 rounded-xl space-y-3">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 border-b border-slate-800 pb-2">Keyence Optics Rig</h3>
                    <div className="space-y-2">
                      <div className="flex justify-between text-xs">
                        <span className="text-slate-400">Height:</span>
                        <span className="font-mono text-sky-400">{cameraHeight} mm</span>
                      </div>
                      <input

                        max="900" 
                        value={cameraHeight} 
                        onChange={(e) => setCameraHeight(parseInt(e.target.value))}

                      <div className="flex justify-between text-xs pt-2">
                        <span className="text-slate-400">Working Distance:</span>
                        <span className="font-mono text-sky-400">{cameraWD} mm</span>
                      </div>
                      <input 
                        type="range" 
                        min="200" 
                        max="800" 
                        value={cameraWD} 
                        onChange={(e) => setCameraWD(parseInt(e.target.value))} 
                        className="w-full accent-sky-400"
                      />
                    </div>

                    <div className="pt-3 border-t border-slate-800">
                      <label htmlFor="can-appearance" className="text-[11px] text-slate-400 block mb-1">Can Appearance:</label>
                      <select id="can-appearance" value={canAppearance} onChange={e => setCanAppearance(e.target.value)}

                        <option value="silver">Plain silver aluminum</option>
                        <option value="yards">YARDS-inspired branded can</option>
                      </select>
                      <p className="text-[10px] mt-1 text-slate-500">Changes all cans on the line immediately. Concept branding, not an official product label.</p>
                    </div>
                    <div className="pt-2">
                      <label className="text-[11px] text-slate-400 block mb-1">Can Format Spec:</label>
                      <select 
                        value={canSize} 
                        onChange={(e) => setCanSize(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs font-mono text-slate-200"
                      >
                        {Object.keys(CAN_SIZES).map(key => (
                          <option key={key} value={key}>{CAN_SIZES[key].name} (Ø {CAN_SIZES[key].od}mm)</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div className="glass-panel p-4 rounded-xl space-y-3">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 border-b border-slate-800 pb-2">Defects &amp; Rejector Demonstration</h3>
                     <div className="flex items-center justify-between text-xs">
                       <label htmlFor="auto-defect-rate" className="text-slate-400">Automatic defective cans</label>
                       <span className="font-mono text-amber-400">{autoDefectRate}%</span>
                     </div>
                     <input id="auto-defect-rate" type="range" min="0" max="50" step="5" value={autoDefectRate} onChange={e => setAutoDefectRate(Number(e.target.value))} className="w-full" />
                     <p className="text-[11px] text-slate-400">Chance of an automatic defect per can. Set to 0% for manual-only demonstrations.</p>
                     <p className="text-xs text-sky-400 font-mono">Manual queue: {queuedCount} defective can(s)</p>
                     <p className="text-[11px] text-slate-400">Click a defect below to add a single defective can at the next fixed-spaced entry position.</p>
                     {lastQueuedDefect && <p className="text-[11px] text-emerald-400">Last added: {DEFECT_TYPES[lastQueuedDefect].name}</p>}
                    <div className="grid grid-cols-2 gap-1.5">
                      {Object.keys(DEFECT_TYPES).filter(k => k !== 'NONE').map(key => (
                        <button
                          key={key}
                          onClick={() => queueDefect(key)}
                          className="p-2 rounded text-[11px] font-medium text-left transition-all border bg-slate-900/60 border-slate-800 text-slate-300 hover:border-red-500 hover:text-red-400"
                        >
                          {DEFECT_TYPES[key].name}
                        </button>
                      ))}
                    </div>
                  </div>

                </div>

              </div>
            </section>

            {/* SECTION 2: VISION HUD & OPENCV METRICS */}
            <section id="vision" className="space-y-4">
              <h2 className="text-xl font-bold text-white tracking-wide">Keyence VS-C320 Vision Inspection HUD</h2>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <div className="glass-panel p-6 rounded-2xl space-y-4">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                    <span className="text-sm font-bold uppercase tracking-wider text-slate-300">Live Lens Field View</span>
                    <span className={`px-2 py-0.5 rounded text-xs font-bold font-mono ${currentScan.status === 'PASS' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : 'bg-red-500/20 text-red-400 border border-red-800'}`}>
                      {currentScan.status}
                    </span>
                  </div>

                  <div className="relative w-full h-56 bg-slate-950 rounded-xl border border-slate-800 flex items-center justify-center overflow-hidden">
                    <div className="absolute inset-0 bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:16px_16px] opacity-40"></div>
                    <div className={`w-36 h-36 rounded-full border-2 border-dashed flex items-center justify-center transition-all ${currentScan.status === 'PASS' ? 'border-emerald-500' : 'border-red-500'}`}>
                      <div className="w-28 h-28 rounded-full border border-sky-400/60 flex items-center justify-center">
                        <div className="w-2.5 h-2.5 rounded-full bg-sky-400"></div>
                      </div>
                    </div>
                    <div className="absolute bottom-3 left-3 text-xs font-mono text-slate-400 bg-slate-900/90 p-2 rounded">
                      <div>Measured OD: {currentScan.measuredOD} mm</div>
                      <div>Measured ID: {currentScan.measuredID} mm</div>
                    </div>
                  </div>
                </div>

                <div className="glass-panel p-6 rounded-2xl space-y-4">
                  <h3 className="text-sm font-bold uppercase tracking-wider text-slate-300 border-b border-slate-800 pb-3">OpenCV Processing Metrics</h3>
                  <div className="space-y-3 font-mono text-xs">
                    <div className="flex justify-between p-2 bg-slate-900 rounded">
                      <span className="text-slate-400">Circularity Score:</span>
                      <span className="text-slate-200 font-bold">{currentScan.circularity}%</span>
                    </div>
                    <div className="flex justify-between p-2 bg-slate-900 rounded">
                      <span className="text-slate-400">AI Confidence:</span>
                      <span className="text-slate-200 font-bold">{currentScan.confidence}%</span>
                    </div>
                    <div className="flex justify-between p-2 bg-slate-900 rounded">
                      <span className="text-slate-400">Active Defect Classification:</span>
                      <span className={currentScan.status === 'PASS' ? 'text-emerald-400' : 'text-red-400'}>{DEFECT_TYPES[currentScan.defectType]?.name}</span>
                    </div>
                    <div className="flex justify-between p-2 bg-slate-900 rounded">
                      <span className="text-slate-400">Total Air Kicks:</span>
                      <span className="text-amber-400 font-bold">{stats.airEjections}</span>
                    </div>
                  </div>
                </div>

              </div>
            </section>

            {/* SECTION 3: PROCESS WORKFLOW */}
            <section id="workflow" className="space-y-4">
              <h2 className="text-xl font-bold text-white tracking-wide">System Workflow</h2>
              <div className="grid grid-cols-1 md:grid-cols-4 gap-4 text-center font-mono">
                <div className="glass-panel p-5 rounded-xl border-sky-500/40 space-y-2">
                  <div className="text-sky-400 text-xs font-bold">STEP 1</div>
                  <div className="text-base font-bold text-white">DETECT</div>
                  <p className="text-xs text-slate-400">Photoelectric sensor senses can arrival and triggers camera shutter.</p>
                </div>
                <div className="glass-panel p-5 rounded-xl border-sky-500/40 space-y-2">
                  <div className="text-sky-400 text-xs font-bold">STEP 2</div>
                  <div className="text-base font-bold text-white">DECIDE</div>
                  <p className="text-xs text-slate-400">OpenCV / AI runs rim geometric checks within 18ms latency.</p>
                </div>
                <div className="glass-panel p-5 rounded-xl border-sky-500/40 space-y-2">
                  <div className="text-sky-400 text-xs font-bold">STEP 3</div>
                  <div className="text-base font-bold text-white">TRACK</div>
                  <p className="text-xs text-slate-400">Defective can is tracked downstream over 2.2 meter distance.</p>
                </div>
                <div className="glass-panel p-5 rounded-xl border-sky-500/40 space-y-2">
                  <div className="text-sky-400 text-xs font-bold">STEP 4</div>
                  <div className="text-base font-bold text-white">REMOVE</div>
                  <p className="text-xs text-slate-400">Solenoid fires air pusher kicking bad can into blue collection bin.</p>
                </div>
              </div>
            </section>

            {/* SECTION 4: ARCHITECTURE */}
            <section id="architecture" className="space-y-4">
              <h2 className="text-xl font-bold text-white tracking-wide">Hardware & Systems Architecture</h2>
              <div className="glass-panel p-6 rounded-2xl space-y-3 font-mono text-sm text-slate-300">
                <div className="p-3 bg-slate-900 rounded border border-slate-800 text-sky-400">1. Photoelectric Sensor → Keyence Smart Camera Shutter (Hardware Interrupt)</div>
                <div className="p-3 bg-slate-900 rounded border border-slate-800 text-emerald-400">2. Keyence Image Processor → Python OpenCV Pipeline (Ethernet/PoE)</div>
                <div className="p-3 bg-slate-900 rounded border border-slate-800 text-amber-400">3. PASS/FAIL Logic Decision → Industrial PLC / Solenoid Valve Delay Timer</div>
                <div className="p-3 bg-slate-900 rounded border border-slate-800 text-red-400">4. Pneumatic Actuator → High-Pressure Air Burst Kickout Station</div>
              </div>
            </section>

            {/* SECTION 5: INSPECTION LOGS & CSV EXPORT */}
            <section id="logs" className="space-y-4">
              <div className="flex justify-between items-center">
                <h2 className="text-xl font-bold text-white tracking-wide">Inspection History Logs</h2>
                <div className="flex items-center space-x-3">
                  <div className="flex bg-slate-900 p-1 rounded-lg border border-slate-800">
                    <button onClick={() => setLogFilter('ALL')} className={`px-3 py-1 rounded text-xs font-mono ${logFilter === 'ALL' ? 'bg-sky-500 text-white' : 'text-slate-400'}`}>ALL</button>
                    <button onClick={() => setLogFilter('PASS')} className={`px-3 py-1 rounded text-xs font-mono ${logFilter === 'PASS' ? 'bg-emerald-500 text-white' : 'text-slate-400'}`}>PASS</button>
                    <button onClick={() => setLogFilter('FAIL')} className={`px-3 py-1 rounded text-xs font-mono ${logFilter === 'FAIL' ? 'bg-red-500 text-white' : 'text-slate-400'}`}>FAIL</button>
